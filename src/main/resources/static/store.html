<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Store — ShopEasy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="announce-bar">
    Free shipping on orders above Rs.499 &nbsp;|&nbsp; Use code <strong>EASY10</strong> for 10% off
</div>

<nav>
    <a class="nav-logo" href="index.html">Shop<span>Easy</span></a>
    <div class="nav-search" style="max-width:400px">
        <input type="text" id="store-search" placeholder="Search in this store..." oninput="filterListings(this.value)">
        <button class="search-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
    </div>
    <div class="nav-right">
        <div id="nav-user-area"></div>
        <a href="cart.html" class="cart-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            Cart <span class="cart-count" id="cart-count">0</span>
        </a>
    </div>
</nav>

<div id="store-content">
    <div style="text-align:center;padding:80px 0;color:var(--muted)">Loading store...</div>
</div>

<footer class="site-footer">
    <div class="footer-bottom container-wide">
        <span>2024 ShopEasy. All rights reserved.</span>
        <a href="index.html" style="color:#94a3b8;text-decoration:none">Back to Shop</a>
    </div>
</footer>

<style>
.store-hero {
    background: linear-gradient(135deg, #0f1f45 0%, #1e3a8a 60%, #2563eb 100%);
    color: white;
    padding: 48px 0 0;
}
.store-hero-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 40px 40px;
    display: flex;
    align-items: center;
    gap: 32px;
}
.store-avatar {
    width: 88px;
    height: 88px;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 800;
    color: white;
    border: 3px solid rgba(255,255,255,0.3);
    flex-shrink: 0;
}
.store-info { flex: 1; }
.store-name { font-size: 32px; font-weight: 800; margin-bottom: 6px; }
.store-meta { font-size: 14px; color: #94a3b8; display: flex; gap: 20px; flex-wrap: wrap; margin-top: 8px; }
.store-meta-item { display: flex; align-items: center; gap: 6px; }
.store-rating { display: flex; align-items: center; gap: 6px; }
.store-stars { color: #fbbf24; font-size: 16px; letter-spacing: 1px; }
.store-tabs {
    background: rgba(0,0,0,0.2);
    border-top: 1px solid rgba(255,255,255,0.1);
}
.store-tabs-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 40px;
    display: flex;
    gap: 0;
}
.store-tab {
    padding: 14px 20px;
    font-size: 14px;
    font-weight: 600;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    background: none;
    border-left: none;
    border-right: none;
    border-top: none;
    border-radius: 0;
    width: auto;
}
.store-tab:hover { color: white; }
.store-tab.active { color: white; border-bottom-color: #60a5fa; }

.store-body {
    max-width: 1280px;
    margin: 0 auto;
    padding: 40px 40px 60px;
}
.store-sort-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
}
.store-sort-bar select {
    padding: 8px 14px;
    border: 1.5px solid #e2e8f0;
    border-radius: 8px;
    font-size: 13px;
    width: auto;
    margin: 0;
    cursor: pointer;
}
.store-product-card {
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
    cursor: pointer;
    border: 1px solid #f1f5f9;
}
.store-product-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}
.store-product-img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    background: #f1f5f9;
}
.store-product-body { padding: 14px; }
.store-product-cat { font-size: 10px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.store-product-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; line-height: 1.4; }
.store-product-desc { font-size: 12px; color: var(--muted); margin-bottom: 10px; line-height: 1.5; }
.store-product-footer { display: flex; align-items: center; justify-content: space-between; }
.store-product-price { font-size: 17px; font-weight: 700; color: var(--primary); }
.store-product-stock { font-size: 11px; color: var(--success); font-weight: 600; }
.store-add-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 7px 12px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    width: auto;
    transition: background 0.2s;
}
.store-add-btn:hover { background: var(--primary); }

.about-card {
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    padding: 32px;
    max-width: 600px;
}
.about-row { display: flex; gap: 12px; margin-bottom: 16px; align-items: flex-start; }
.about-label { font-size: 13px; font-weight: 700; color: var(--muted); min-width: 120px; }
.about-value { font-size: 14px; color: var(--text); }
</style>

<script>
const params = new URLSearchParams(window.location.search);
const sellerId = params.get('id');
const user = JSON.parse(localStorage.getItem('user') || 'null');

const PRODUCT_IMAGES = {
    1:'https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=400&q=80',2:'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&q=80',3:'https://images.unsplash.com/photo-1600294037681-c80b4cb5b434?w=400&q=80',4:'https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=400&q=80',5:'https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=400&q=80',6:'https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=400&q=80',7:'https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?w=400&q=80',8:'https://images.unsplash.com/photo-1585771724684-38269d6639fd?w=400&q=80',9:'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&q=80',10:'https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=400&q=80',11:'https://images.unsplash.com/photo-1491553895911-0055eca6402d?w=400&q=80',12:'https://images.unsplash.com/photo-1449505278894-297fdb3edbc1?w=400&q=80',13:'https://images.unsplash.com/photo-1560769629-975ec94e6a86?w=400&q=80',14:'https://images.unsplash.com/photo-1585515320310-259814833e62?w=400&q=80',15:'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=400&q=80',16:'https://images.unsplash.com/photo-1574269909862-7e1d70bb8078?w=400&q=80',17:'https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=400&q=80',18:'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=400&q=80',19:'https://images.unsplash.com/photo-1617083934551-ac1f3b4b7b4e?w=400&q=80',20:'https://images.unsplash.com/photo-1617083934551-ac1f3b4b7b4e?w=400&q=80',21:'https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=400&q=80',22:'https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?w=400&q=80',23:'https://images.unsplash.com/photo-1512820790803-83ca734da794?w=400&q=80',24:'https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=400&q=80',25:'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400&q=80',26:'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=400&q=80',27:'https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=400&q=80',28:'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=400&q=80',29:'https://images.unsplash.com/photo-1558060370-d644479cb6f7?w=400&q=80',30:'https://images.unsplash.com/photo-1594736797933-d0501ba2fe65?w=400&q=80',31:'https://images.unsplash.com/photo-1611996575749-79a3a250f948?w=400&q=80'
};

const CATEGORY_FALLBACK = {
    'Electronics': 'https://images.unsplash.com/photo-1468495244123-6c6c332eeece?w=400&q=80',
    'Footwear':    'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&q=80',
    'Kitchen':     'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=400&q=80',
    'Sports':      'https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=400&q=80',
    'Books':       'https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=400&q=80',
    'Home Decor':  'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=400&q=80',
    'Toys':        'https://images.unsplash.com/photo-1558060370-d644479cb6f7?w=400&q=80',
};

let storeData = null;
let allListings = [];
let activeTab = 'products';

function renderNav() {
    const area = document.getElementById('nav-user-area');
    if (user) {
        area.innerHTML = `<div class="nav-user-menu">
            <button class="nav-user-btn" onclick="toggleUserMenu()">
                <div class="nav-avatar">${user.username.charAt(0).toUpperCase()}</div>
                <span>${user.username}</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="user-dropdown" id="user-dropdown">
                <a href="profile.html" class="dropdown-item">My Profile</a>
                <a href="orders.html" class="dropdown-item">My Orders</a>
                <div class="dropdown-divider"></div>
                <a href="#" class="dropdown-item dropdown-logout" onclick="logout()">Sign Out</a>
            </div>
        </div>`;
    } else {
        area.innerHTML = `<a href="login.html" class="nav-login-link">Sign In</a>`;
    }
}

function toggleUserMenu() { document.getElementById('user-dropdown').classList.toggle('open'); }
document.addEventListener('click', e => { const m = document.getElementById('user-dropdown'); if (m && !e.target.closest('.nav-user-menu')) m.classList.remove('open'); });
function logout() { localStorage.removeItem('user'); window.location.href = 'landing.html'; }

async function updateCartCount() {
    if (user) {
        try { const r = await fetch(`http://localhost:8080/api/cart/${user.userId}`); const items = await r.json(); document.getElementById('cart-count').textContent = items.reduce((s,i)=>s+i.quantity,0); } catch {}
    } else {
        document.getElementById('cart-count').textContent = JSON.parse(localStorage.getItem('cart')||'[]').reduce((s,i)=>s+i.quantity,0);
    }
}

async function addToCart(listing) {
    const btn = document.getElementById(`sbtn-${listing.productId}`);
    if (btn) { btn.textContent = 'Adding...'; btn.disabled = true; }
    const product = { productId: listing.productId, productName: listing.productName, category: listing.category, basePrice: listing.sellerPrice };
    if (user) {
        try {
            await fetch('http://localhost:8080/api/cart/add', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ userId: user.userId, productId: product.productId, productName: product.productName, category: product.category, basePrice: product.basePrice, quantity: 1, imageUrl: PRODUCT_IMAGES[product.productId] || '' })
            });
        } catch(e) {}
    } else {
        const cart = JSON.parse(localStorage.getItem('cart')||'[]');
        const ex = cart.find(i=>i.productId===product.productId);
        if (ex) ex.quantity++; else cart.push({...product, quantity:1, image: PRODUCT_IMAGES[product.productId]});
        localStorage.setItem('cart', JSON.stringify(cart));
    }
    await updateCartCount();
    if (btn) { btn.textContent = 'Added'; btn.style.background = '#16a34a'; btn.disabled = false; setTimeout(()=>{btn.textContent='Add to Cart';btn.style.background='';}, 1400); }
}

function renderStars(rating) {
    const r = parseFloat(rating) || 0;
    const full = Math.floor(r);
    const half = r - full >= 0.5;
    let stars = '';
    for (let i = 0; i < full; i++) stars += '★';
    if (half) stars += '½';
    return stars;
}

function showTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.store-tab').forEach(t => t.classList.remove('active'));
    document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
    if (tab === 'products') renderProducts(allListings);
    if (tab === 'reviews')  renderReviews();
    if (tab === 'about')    renderAbout();
}

function renderReviews() {
    const body = document.getElementById('store-tab-body');
    const reviews = storeData.reviews || [];
    if (!reviews.length) {
        body.innerHTML = '<div class="card" style="text-align:center;padding:48px;color:var(--muted)">No reviews yet for this store.</div>';
        return;
    }
    const avg = (reviews.reduce((s, r) => s + r.rating, 0) / reviews.length).toFixed(1);
    body.innerHTML = `
        <div style="display:flex;align-items:center;gap:24px;background:white;border-radius:12px;padding:24px;margin-bottom:24px;box-shadow:0 2px 12px rgba(0,0,0,0.07)">
            <div style="text-align:center;min-width:100px">
                <div style="font-size:52px;font-weight:800;color:var(--primary);line-height:1">${avg}</div>
                <div style="color:#fbbf24;font-size:20px;margin:4px 0">${'★'.repeat(Math.round(avg))}</div>
                <div style="font-size:13px;color:var(--muted)">${reviews.length} review${reviews.length!==1?'s':''}</div>
            </div>
            <div style="flex:1;border-left:1px solid #e2e8f0;padding-left:24px">
                ${[5,4,3,2,1].map(n => {
                    const count = reviews.filter(r => r.rating === n).length;
                    const pct = Math.round((count / reviews.length) * 100);
                    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
                        <span style="font-size:13px;color:var(--muted);min-width:12px">${n}</span>
                        <div style="flex:1;height:8px;background:#f1f5f9;border-radius:4px;overflow:hidden">
                            <div style="width:${pct}%;height:100%;background:#fbbf24;border-radius:4px"></div>
                        </div>
                        <span style="font-size:12px;color:var(--muted);min-width:28px">${count}</span>
                    </div>`;
                }).join('')}
            </div>
        </div>
        ${reviews.map(r => `
        <div style="background:white;border-radius:12px;padding:20px 24px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,0.07)">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
                <div style="display:flex;align-items:center;gap:12px">
                    <div style="width:40px;height:40px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:16px">${r.customer_name.charAt(0)}</div>
                    <div>
                        <div style="font-weight:700;font-size:14px;color:var(--text)">${r.customer_name}</div>
                        <div style="color:#fbbf24;font-size:14px">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>
                    </div>
                </div>
                <div style="font-size:12px;color:#94a3b8">${r.created_at ? new Date(r.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : ''}</div>
            </div>
            <p style="font-size:14px;color:var(--muted);line-height:1.7;margin:0">${r.review_text}</p>
        </div>`).join('')}`;
}

function filterListings(query) {
    if (!query.trim()) { renderProducts(allListings); return; }
    const q = query.toLowerCase();
    renderProducts(allListings.filter(l => l.productName.toLowerCase().includes(q) || (l.category||'').toLowerCase().includes(q)));
}

function sortListings(val) {
    let sorted = [...allListings];
    if (val === 'price-asc')  sorted.sort((a,b) => Number(a.sellerPrice)-Number(b.sellerPrice));
    if (val === 'price-desc') sorted.sort((a,b) => Number(b.sellerPrice)-Number(a.sellerPrice));
    if (val === 'name-asc')   sorted.sort((a,b) => a.productName.localeCompare(b.productName));
    renderProducts(sorted);
}

function renderProducts(listings) {
    const body = document.getElementById('store-tab-body');
    if (!listings.length) { body.innerHTML = '<p style="color:var(--muted);padding:40px 0">No products found.</p>'; return; }
    body.innerHTML = `
        <div class="store-sort-bar">
            <span style="font-size:13px;color:var(--muted)">${listings.length} product${listings.length!==1?'s':''}</span>
            <select onchange="sortListings(this.value)">
                <option value="default">Sort: Default</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="name-asc">Name: A to Z</option>
            </select>
        </div>
        <div class="grid">
            ${listings.map(l => {
                const img = PRODUCT_IMAGES[l.productId] || CATEGORY_FALLBACK[l.category] || '';
                const mrp = Math.round(Number(l.sellerPrice) * 1.2);
                return `<div class="store-product-card" onclick="window.location.href='product.html?id=${l.productId}'">
                    <img class="store-product-img" src="${img}" alt="${l.productName}" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&q=80'">
                    <div class="store-product-body">
                        <div class="store-product-cat">${l.category}</div>
                        <div class="store-product-name">${l.productName}</div>
                        <div class="store-product-desc">${(l.description||'').substring(0,55)}${(l.description||'').length>55?'...':''}</div>
                        <div class="store-product-footer">
                            <div>
                                <div class="store-product-price">Rs.${Number(l.sellerPrice).toLocaleString('en-IN')}</div>
                                <div class="store-product-stock">${l.currentQuantity > 0 ? l.currentQuantity + ' in stock' : 'Out of stock'}</div>
                            </div>
                            <button class="store-add-btn" id="sbtn-${l.productId}" onclick="event.stopPropagation();addToCart(${JSON.stringify(l).replace(/"/g,'&quot;')})">Add to Cart</button>
                        </div>
                    </div>
                </div>`;
            }).join('')}
        </div>`;
}

function renderAbout() {
    const body = document.getElementById('store-tab-body');
    const since = storeData.memberSince ? new Date(storeData.memberSince).toLocaleDateString('en-IN', {day:'numeric',month:'long',year:'numeric'}) : 'N/A';
    const reviews = storeData.reviews || [];
    const avg = reviews.length ? (reviews.reduce((s,r)=>s+r.rating,0)/reviews.length).toFixed(1) : storeData.rating;
    body.innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start">
            <div class="about-card">
                <h3 style="margin-bottom:16px">About ${storeData.businessName}</h3>
                ${storeData.description ? `<p style="font-size:15px;color:var(--muted);line-height:1.8;margin-bottom:24px">${storeData.description}</p>` : ''}
                <div class="about-row"><div class="about-label">Speciality</div><div class="about-value">${storeData.speciality || '—'}</div></div>
                <div class="about-row"><div class="about-label">Location</div><div class="about-value">${storeData.location || '—'}</div></div>
                <div class="about-row"><div class="about-label">Rating</div><div class="about-value"><span style="color:#fbbf24;font-size:16px">${renderStars(avg)}</span> ${avg}/5</div></div>
                <div class="about-row"><div class="about-label">Member Since</div><div class="about-value">${since}</div></div>
                <div class="about-row"><div class="about-label">Total Products</div><div class="about-value">${storeData.totalListings} listings</div></div>
                <div class="about-row"><div class="about-label">Status</div><div class="about-value"><span class="badge delivered">Verified Seller</span></div></div>
            </div>
            <div class="about-card">
                <h3 style="margin-bottom:16px">Why Shop Here</h3>
                <div style="display:flex;flex-direction:column;gap:14px">
                    <div style="display:flex;gap:12px;align-items:flex-start">
                        <div style="width:36px;height:36px;background:#eff6ff;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><path d="M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z"/></svg>
                        </div>
                        <div><div style="font-weight:700;font-size:14px;margin-bottom:2px">100% Genuine Products</div><div style="font-size:13px;color:var(--muted)">All products are sourced directly from authorized distributors.</div></div>
                    </div>
                    <div style="display:flex;gap:12px;align-items:flex-start">
                        <div style="width:36px;height:36px;background:#eff6ff;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13" rx="2"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>

}

async function loadStore() {
    if (!sellerId) { document.getElementById('store-content').innerHTML = '<div style="text-align:center;padding:80px;color:var(--muted)">No seller ID provided.</div>'; return; }
    try {
        const res = await fetch(`http://localhost:8080/api/sellers/${sellerId}`);
        if (!res.ok) throw new Error('Not found');
        storeData = await res.json();
        allListings = storeData.listings || [];
        document.title = storeData.businessName + ' — ShopEasy';

        const since = storeData.memberSince ? new Date(storeData.memberSince).toLocaleDateString('en-IN', {month:'long',year:'numeric'}) : '';

        document.getElementById('store-content').innerHTML = `
            <div class="store-hero">
                <div class="store-hero-inner">
                    <div class="store-avatar">${storeData.businessName.charAt(0).toUpperCase()}</div>
                    <div class="store-info">
                        <div class="store-name">${storeData.businessName}</div>
                        <div class="store-rating">
                            <span class="store-stars">${renderStars(storeData.rating)}</span>
                            <span style="font-size:14px;color:#94a3b8">${storeData.rating} / 5.0</span>
                        </div>
                        <div class="store-meta">
                            <div class="store-meta-item">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                                ${storeData.totalListings} Products
                            </div>
                            ${storeData.speciality ? `<div class="store-meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>${storeData.speciality}</div>` : ''}
                            ${storeData.location ? `<div class="store-meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${storeData.location}</div>` : ''}
                            <div class="store-meta-item">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><path d="M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z"/></svg>
                                Verified Seller
                            </div>
                            ${since ? `<div class="store-meta-item">Member since ${since}</div>` : ''}
                        </div>
                    </div>
                    <a href="index.html" style="color:#94a3b8;font-size:13px;text-decoration:none;white-space:nowrap">Back to Shop</a>
                </div>
                <div class="store-tabs">
                    <div class="store-tabs-inner">
                        <button class="store-tab active" data-tab="products" onclick="showTab('products')">All Products</button>
                        <button class="store-tab" data-tab="reviews" onclick="showTab('reviews')">Reviews</button>
                        <button class="store-tab" data-tab="about" onclick="showTab('about')">About Store</button>
                    </div>
                </div>
            </div>
            <div class="store-body">
                <div id="store-tab-body"></div>
            </div>`;

        renderProducts(allListings);
    } catch(e) {
        document.getElementById('store-content').innerHTML = '<div style="text-align:center;padding:80px;color:var(--muted)">Could not load store. Make sure the server is running.</div>';
    }
}

renderNav();
updateCartCount();
loadStore();
</script>
